<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adi Srinivasulu - Ecologist, Musician, Photographer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background-color: white;
            padding: 40px 30px;
            border-right: 2px dotted #ddd;
            z-index: 100;
        }

        .text-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 48px;
            font-weight: 300;
            margin-bottom: 40px;
            line-height: 1.2;
        }

        .tagline {
            font-size: 18px;
            color: #666;
            font-weight: 300;
            margin-bottom: 60px;
            line-height: 1.6;
        }

        .social-links {
            display: flex;
            gap: 20px;
        }

        .social-links a {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #333;
            border-radius: 50%;
            color: #333;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            background-color: #333;
            color: white;
        }

        .gallery-container {
            margin-left: 280px;
            padding: 40px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            aspect-ratio: 4/3;
            background-color: #e0e0e0;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.02);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gallery-item.portrait {
            grid-row: span 2;
            aspect-ratio: 3/4;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #999;
            min-height: 300px;
        }

        @media (max-width: 1024px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 2px dotted #ddd;
            }

            .gallery-container {
                margin-left: 0;
                padding: 20px;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .gallery-item.portrait {
                grid-row: span 1;
                aspect-ratio: 4/3;
            }
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 36px;
            }

            .tagline {
                font-size: 16px;
            }

            .gallery-container {
                padding: 15px;
            }

            .gallery-grid {
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="text-label"></div>
        <h1>Adi<br>Srinivasulu</h1>
        <p class="tagline">ecologist, musician,<br>photographer</p>
        <div class="social-links">
            <a href="https://instagram.com/otomops" target="_blank" aria-label="Instagram">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
            </a>
            <a href="mailto:a.chelmala1@gmail.com" aria-label="Email">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
            </a>
        </div>
    </aside>

    <main class="gallery-container">
        <div class="gallery-grid" id="gallery">
            <div class="loading">Loading gallery...</div>
        </div>
    </main>

    <script>
        const IMAGES_FOLDER = 'images';

        async function loadGallery() {
            const gallery = document.getElementById('gallery');
            
            try {
                const response = await fetch('gallery.json');
                if (!response.ok) throw new Error('gallery.json not found');
                
                const data = await response.json();
                const images = data.images || [];
                
                if (images.length === 0) {
                    gallery.innerHTML = '<div class="loading">No images found. Add images to the images folder and run generate_gallery.py</div>';
                    return;
                }
                
                gallery.innerHTML = '';
                
                images.forEach(img => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    
                    if (img.portrait) {
                        item.classList.add('portrait');
                    }
                    
                    const image = document.createElement('img');
                    image.src = `${IMAGES_FOLDER}/${img.filename}`;
                    image.alt = img.alt || img.filename;
                    image.loading = 'lazy';
                    
                    image.onerror = function() {
                        item.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;padding:20px;text-align:center;">Image not found:<br>${img.filename}</div>`;
                    };
                    
                    item.appendChild(image);
                    gallery.appendChild(item);
                });
                
            } catch (error) {
                console.error('Error loading gallery:', error);
                gallery.innerHTML = '<div class="loading">Error loading gallery. Make sure gallery.json exists.</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadGallery);
    </script>
</body>
</html>
